name: CI/CD Portfolio Api Release

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Check out the code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '18'

            # Install dependencies and build locally
            - name: Install deps and build
              run: |
                  npm ci
                  npm run build || true

            # Set up SSH key for copying files
            - name: Set up SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

            # Copy files to the server using rsync (excludes the git folder)
            - name: Copy files to server
              run: |
                  # optional: adjust excludes as needed (e.g. .github, .env)
                  RSYNC_EXCLUDES="--exclude='.git' --exclude='.github' "
                  rsync -az --delete $RSYNC_EXCLUDES -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.APP_PATH }}

            # Restart process on remote
            - name: Restart remote process
              run: |
                  ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "pm2 restart ${{ secrets.PROCESS_APP_NAME }} || pm2 start ${{ secrets.PROCESS_APP_NAME }}"


# Useful links:
    # https://docs.github.com/en/enterprise-cloud@latest/authentication/connecting-to-github-with-ssh/generating-a-new-ssh-key-and-adding-it-to-the-ssh-agent
    # https://docs.github.com/en/enterprise-cloud@latest/authentication/connecting-to-github-with-ssh/adding-a-new-ssh-key-to-your-github-account
